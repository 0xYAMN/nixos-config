name: update flake.lock

on:
  schedule:
    - cron: "0 4 * * *"   # daily, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v23

      # catppuccin is pinned: its latest rev pulls catppuccin-whiskers, which
      # does not compile on current rustc. Update every other root input.
      - name: nix flake update (except catppuccin)
        run: |
          inputs=$(jq -r '.nodes.root.inputs | keys[] | select(. != "catppuccin")' flake.lock)
          nix flake update $inputs

      - name: nix flake check
        run: nix flake check -L

      - name: commit and push
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "flake: update inputs" flake.lock
          git push
